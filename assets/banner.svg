<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-8px) scale(1.05); opacity: 0.8; }
        100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      }
      @keyframes pathFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes ringRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .animated-bg-circle {
        animation: floatPulse 6s ease-in-out infinite;
      }
      .animated-pulse-line {
        stroke-dasharray: 10 15;
        animation: pathFlow 8s linear infinite;
      }
      .rotating-gear {
        transform-origin: 700px 130px;
        animation: ringRotate 25s linear infinite;
      }
      .foreground-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
      }
      .foreground-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #bae6fd;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e0f2fe;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="260" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
  </g>

  <!-- Background Dynamic Graphic Elements (Positioned in Background) -->
  <circle cx="700" cy="130" r="110" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.3" class="rotating-gear" stroke-dasharray="15 8" />
  <circle cx="700" cy="130" r="80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
  
  <circle cx="100" cy="50" r="70" fill="url(#glowGrad)" filter="url(#glow)" class="animated-bg-circle" />
  <circle cx="680" cy="200" r="90" fill="url(#glowGrad)" filter="url(#glow)" class="animated-bg-circle" style="animation-delay: -3s;" />

  <!-- Animated Data Flow Lines -->
  <path d="M 50 210 Q 250 170 450 220 T 750 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" class="animated-pulse-line" />
  <path d="M 100 230 Q 350 190 550 240 T 780 190" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5" class="animated-pulse-line" style="animation-delay: -4s;" />

  <!-- Subtle Backdrop Card for Text Clarity -->
  <rect x="35" y="35" width="540" height="190" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Foreground Content (Guaranteed Crisp & Unobscured) -->
  <g transform="translate(55, 65)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="145" height="26" rx="13" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
    <text x="72.5" y="17" text-anchor="middle" class="pill-text" fill="#38bdf8">⚡ EDGE AI &amp; TINYML</text>

    <!-- Main Title -->
    <text x="0" y="62" class="foreground-title">Awesome Edge AI</text>
    <text x="325" y="62" class="foreground-title" fill="#38bdf8">Platform</text>

    <!-- Subtitle -->
    <text x="0" y="94" class="foreground-subtitle">Curated SaaS Platforms, Inference Runtimes &amp; On-Device ML</text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 118)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" class="pill-text">🌐 SaaS Fleets</text>

      <!-- Pill 2 -->
      <rect x="120" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="185" y="16" text-anchor="middle" class="pill-text">🚀 Open Runtimes</text>

      <!-- Pill 3 -->
      <rect x="260" y="0" width="120" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="320" y="16" text-anchor="middle" class="pill-text">🤖 On-Device LLMs</text>
    </g>
  </g>
</svg>
